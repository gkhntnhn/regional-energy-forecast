# General project settings
project:
  name: "energy-forecast"
  version: "0.1.0"
  timezone: "Europe/Istanbul"

logging:
  level: "INFO"
  format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level}</level> | <cyan>{name}</cyan> - <level>{message}</level>"
  rotation: "10 MB"
  retention: "30 days"

region:
  name: "Uludag"
  mode: "grid"

  # Legacy cities — rollback: mode: "legacy" ile geri donulur
  cities:
    - name: "Bursa"
      weight: 0.60
      latitude: 40.183
      longitude: 29.050
    - name: "Balikesir"
      weight: 0.24
      latitude: 39.653
      longitude: 27.886
    - name: "Yalova"
      weight: 0.10
      latitude: 40.655
      longitude: 29.272
    - name: "Canakkale"
      weight: 0.06
      latitude: 40.146
      longitude: 26.402

  # Grid mode — ECMWF IFS 0.25deg, 15 points, hybrid weighting
  # Auto-generated from data/static/grid_points.yaml
  provinces:
    - name: "Bursa"
      consumption_weight: 0.60
      grid_points:
        - {latitude: 40.50, longitude: 29.25, population_weight: 0.026519}
        - {latitude: 40.25, longitude: 28.25, population_weight: 0.029466}
        - {latitude: 40.25, longitude: 28.75, population_weight: 0.025783}
        - {latitude: 40.25, longitude: 29.00, population_weight: 0.743278}
        - {latitude: 40.25, longitude: 29.50, population_weight: 0.020258}
        - {latitude: 40.00, longitude: 28.50, population_weight: 0.040516}
        - {latitude: 40.00, longitude: 29.50, population_weight: 0.114180}

    - name: "Balikesir"
      consumption_weight: 0.24
      grid_points:
        - {latitude: 40.25, longitude: 28.00, population_weight: 0.156566}
        - {latitude: 40.00, longitude: 27.75, population_weight: 0.075758}
        - {latitude: 39.75, longitude: 27.00, population_weight: 0.156566}
        - {latitude: 39.75, longitude: 28.00, population_weight: 0.186869}
        - {latitude: 39.50, longitude: 27.00, population_weight: 0.060606}
        - {latitude: 39.50, longitude: 27.75, population_weight: 0.363635}

    - name: "Yalova"
      consumption_weight: 0.10
      grid_points:
        - {latitude: 40.50, longitude: 29.00, population_weight: 1.000000}

    - name: "Canakkale"
      consumption_weight: 0.06
      grid_points:
        - {latitude: 40.00, longitude: 26.50, population_weight: 1.000000}

boxcox:
  enabled: true
  lambda_param: 0.3893    # Optimal for 2022-2026 consumption data

forecast:
  horizon_hours: 48
  frequency: "1h"
  min_lag: 48

paths:
  raw_excel: "data/raw/Consumption_Input_Format.xlsx"
  features_historical: "data/processed/features_historical.parquet"
  features_forecast: "data/processed/features_forecast.parquet"
  features_data: "data/processed/features_historical.parquet"  # Alias for training
  models_dir: "models"
  ensemble_weights: "models/ensemble_weights.json"

epias_api:
  auth_url: "https://giris.epias.com.tr/cas/v1/tickets"
  base_url: "https://seffaflik.epias.com.tr/electricity-service/v1"
  cache_dir: "data/external/epias"
  rate_limit_seconds: 10.0
  token_ttl_seconds: 3600.0
  timeout_seconds: 60.0
  retry_attempts: 3
  retry_min_wait: 4
  retry_max_wait: 60
