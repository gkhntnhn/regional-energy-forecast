# OpenMeteo API configuration (official SDK)
#
# NOTE: Location coordinates and weights (Bursa/Balikesir/Yalova/Canakkale)
# are NOT defined here — they live under `region.cities` (legacy mode) or
# `region.provinces` (grid mode) in `configs/settings.yaml`. OpenMeteoClient
# resolves them via `_get_locations()` in src/energy_forecast/data/openmeteo_client.py.
# This split keeps location SoT inside the regional model rather than
# duplicating it across weather-config files.

api:
  base_url_historical: "https://archive-api.open-meteo.com/v1/archive"
  base_url_historical_forecast: "https://historical-forecast-api.open-meteo.com/v1/forecast"
  base_url_forecast: "https://api.open-meteo.com/v1/forecast"
  model: "ecmwf_ifs"
  timeout: 30
  retry_attempts: 3
  backoff_factor: 0.2

geocoding:
  enabled: false
  api_url: "https://geocoding-api.open-meteo.com/v1/search"
  language: "tr"
  count: 1

variables:
  - temperature_2m
  - relative_humidity_2m
  - dew_point_2m
  - apparent_temperature
  - precipitation
  - snow_depth
  - weather_code
  - surface_pressure
  - wind_speed_10m
  - wind_direction_10m
  - shortwave_radiation

cache:
  backend: "sqlite"
  path: "data/external/weather_cache.db"
  ttl_hours: 6
  parquet_dir: "data/external/weather"
  file_pattern: "weather_cache_{year}.parquet"
