# CatBoost model configuration
training:
  task_type: "CPU"
  iterations: 5000
  learning_rate: 0.05
  depth: 6
  loss_function: "RMSE"       # R1: RMSE beat MAE by 0.16% (2.42% vs 2.58%)
  eval_metric: "MAPE"
  early_stopping_rounds: 100
  bootstrap_type: "MVS"       # R1 lesson: GPU compat, subsample requires MVS
  has_time: true
  random_seed: 42
  verbose: 500

# 35 categorical features (28 R2 + 7 re-enabled for broader ensemble)
categorical_features:
  # Time
  - hour
  - day_of_week
  - day_of_month
  - week_of_year
  - month
  - quarter
  - season
  - year
  # Holiday / special days
  - is_holiday
  - is_weekend
  - is_ramadan
  - is_bridge_day
  - tatil_tipi
  - bayram_gun_no
  - holiday_duration
  # Interaction (flag x hour)
  - is_holiday_x_hour
  - is_ramadan_x_hour
  - is_weekend_x_hour
  # Time-period flags
  - is_business_hours
  - is_peak
  - is_ramp_morning
  - is_ramp_evening        # Re-enabled
  - is_friday
  - is_monday
  - is_sunday
  # Weather
  - weather_code
  - weather_group
  - wth_extreme_cold
  - wth_extreme_hot        # Re-enabled
  - wth_extreme_wind       # Re-enabled
  - wth_heavy_precip       # Re-enabled
  - wth_is_severe          # Re-enabled
  # Season / solar
  - is_cooling_season
  - is_heating_season      # Re-enabled
  - sol_is_daylight        # Re-enabled
  # NOTE: wth_severity (0-3 int) and sol_cloud_proxy (float) are numeric, NOT categorical

nan_handling:
  categorical: "missing"
