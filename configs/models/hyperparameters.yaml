# Optuna hyperparameter search spaces — R10 (Box-Cox + loss search + new data ranges)
# Each param: type (int/float/categorical), low, high, step?, log?, choices?
# Adding a new parameter to YAML requires NO code change

target_col: consumption

catboost:
  n_trials: 30             # R6 Production HPO
  search_space:
    # iterations: fixed at 10000 in catboost.yaml (early stopping decides)
    learning_rate:
      type: float
      low: 0.01             # Widened: new data needs lower lr exploration
      high: 0.05            # Narrowed upper: 0.12 overfits at 585 iter
      log: true
    depth:
      type: int
      low: 4                # Widened: explore shallower trees
      high: 7
    l2_leaf_reg:
      type: float
      low: 1.0
      high: 10.0            # Widened: more regularization with lower lr
    min_child_samples:
      type: int
      low: 20               # Widened: explore smaller leaves
      high: 150             # Widened: explore larger leaves
    subsample:
      type: float
      low: 0.6              # Slightly widened
      high: 0.95
    loss_function:
      type: categorical
      choices: ["RMSE","MAE"]   # Fixed — RMSE beat MAE by 0.16% (2.42% vs 2.58%)

tft:
  n_trials: 15             # R6 Production HPO
  search_space:
    # hidden_size: fixed at 64 in tft.yaml (R5: 128→64, optimal for 13 covariates)
    # windows_batch_size: fixed at 512 in tft.yaml (RunPod L4/A100)
    n_head:
      type: categorical
      choices: [2, 4]     # 1 too weak for hidden=64, 2-4 optimal
    dropout:
      type: float
      low: 0.05
      high: 0.2           # Wider range around default 0.1
    n_rnn_layers:
      type: categorical
      choices: [1, 2]     # Explore deeper RNN (NF: n_rnn_layers)
    learning_rate:
      type: float
      low: 0.0005
      high: 0.005         # Range around default 0.001
      log: true
    loss:                  # NEW: let Optuna pick the best loss
      type: categorical
      choices: ["mae", "rmse", "quantile"]

tsmixerx:
  n_trials: 30             # R7 Production HPO (expanded from 15)
  search_space:
    n_block:
      type: categorical
      choices: [2, 3, 4]
    ff_dim:
      type: categorical
      choices: [64, 128, 256]
    dropout:
      type: float
      low: 0.05
      high: 0.3
    learning_rate:
      type: float
      low: 0.0005
      high: 0.005
      log: true
    max_steps:
      type: categorical
      choices: [10000]     # Fixed: TSMixerx never early stops, more steps = better
    loss:                  # NEW: let Optuna pick the best loss
      type: categorical
      choices: ["mae", "mse", "rmse", "huber_0.5"]

cross_validation:
  n_splits: 12             # Production: 12-fold TSCV
  val_months: 1
  test_months: 1
  gap_hours: 0
  shuffle: false
