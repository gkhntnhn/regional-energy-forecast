# Optuna hyperparameter search spaces — R2 (R1-informed narrowed ranges)
# Each param: type (int/float/categorical), low, high, step?, log?, choices?
# Adding a new parameter to YAML requires NO code change

target_col: consumption

catboost:
  n_trials: 40             # R11 Grid Weather HPO — 7 params, expanded from R7 (30t/6p)
  search_space:
    # iterations: fixed at 10000 in catboost.yaml (early stopping decides)
    learning_rate:
      type: float
      low: 0.03            # R11: expanded from [0.05, 0.12] — grid weather robustness
      high: 0.15
      log: true
    depth:
      type: int
      low: 5
      high: 8              # R11: +1 (was 7) — grid weather feature space richer
    l2_leaf_reg:
      type: float
      low: 1.0
      high: 5.0            # R11: expanded from [1.0, 3.0] — grid regularization
    min_child_samples:
      type: int
      low: 30              # R11: expanded from [50, 100]
      high: 120
    subsample:
      type: float
      low: 0.6              # R11: expanded from [0.65, 0.95]
      high: 0.95
    loss_function:
      type: categorical
      choices: ["RMSE","MAE"]
    colsample_bylevel:
      type: float
      low: 0.6              # R11: NEW — CPU-only, feature sampling per split
      high: 1.0
    leaf_estimation_iterations:
      type: int
      low: 1                # R11: NEW — Newton iterations for leaf values
      high: 10

tft:
  n_trials: 15             # R6 Production HPO
  search_space:
    # hidden_size: fixed at 64 in tft.yaml (R5: 128→64, optimal for 13 covariates)
    # windows_batch_size: fixed at 512 in tft.yaml (RunPod L4/A100)
    n_head:
      type: categorical
      choices: [2, 4]     # 1 too weak for hidden=64, 2-4 optimal
    dropout:
      type: float
      low: 0.05
      high: 0.2           # Wider range around default 0.1
    n_rnn_layers:
      type: categorical
      choices: [1, 2]     # Explore deeper RNN (NF: n_rnn_layers)
    learning_rate:
      type: float
      low: 0.0005
      high: 0.005         # Range around default 0.001
      log: true

tsmixerx:
  n_trials: 100            # R12: 40 → 100 (12 boyut + Hyperband)
  pruner: "hyperband"      # R12: MedianPruner → HyperbandPruner (FAZ 1+2 onerisi)
  pruner_kwargs:
    min_resource: 200
    max_resource: 3000
    reduction_factor: 3
  search_space:
    # ============ MIMARI (4 boyut) ============
    n_block:
      type: categorical
      choices: [3, 4]               # R12: 2 elendi (R7+R11 hep 3); 4 yeni dene
    ff_dim:
      type: categorical
      choices: [96, 128, 192]       # R12: 64 underparam, 256 overparam (FAZ 1)
    dropout:
      type: float
      low: 0.10                     # R12: R11 best 0.146 etrafinda dar
      high: 0.25
    input_size:                     # ⭐ R12 YENI
      type: categorical
      choices: [168, 240, 336]      # 7g/10g/14g context (Shi 2024: <504)
    # ============ NORMALIZATION (2 boyut) ============
    revin:                          # ⭐ R12 YENI
      type: categorical
      choices: [true, false]
    scaler_type:                    # ⭐ R12 YENI
      type: categorical
      choices: ["robust", "identity", "standard"]
    # ============ TRAINING (4 boyut) ============
    learning_rate:
      type: float
      low: 0.0005                   # R12: R11 best 0.0038 etrafinda dar
      high: 0.005
      log: true
    weight_decay:
      type: float
      low: 0.00001                  # R12: R11 best 0.00094 etrafinda
      high: 0.005
      log: true
    windows_batch_size:
      type: categorical
      choices: [128, 256, 512]      # 4060 Ti'da 128, A40/L4'te 512
    early_stop_patience_steps:      # ⭐ R12 YENI
      type: int
      low: 100
      high: 400
    # ============ SAMPLING (1 boyut) ============
    step_size:                      # ⭐ R12 YENI
      type: categorical
      choices: [6, 12, 24]
    # ============ LOSS (1 boyut) ============
    loss:
      type: categorical
      choices: ["mae", "huber_0.5", "huber", "huber_2.0"]  # R12: 5 huber variant tarama
    # max_steps: FIXED at 5000 in tsmixerx.yaml (Hyperband bunu yonetir)

cross_validation:
  n_splits: 12             # Production: 12-fold TSCV
  val_months: 1
  test_months: 1
  gap_hours: 0
  shuffle: false
