# Optuna hyperparameter search spaces — R2 (R1-informed narrowed ranges)
# Each param: type (int/float/categorical), low, high, step?, log?, choices?
# Adding a new parameter to YAML requires NO code change

target_col: consumption

catboost:
  n_trials: 40             # R11 Grid Weather HPO — 7 params, expanded from R7 (30t/6p)
  search_space:
    # iterations: fixed at 10000 in catboost.yaml (early stopping decides)
    learning_rate:
      type: float
      low: 0.03            # R11: expanded from [0.05, 0.12] — grid weather robustness
      high: 0.15
      log: true
    depth:
      type: int
      low: 5
      high: 8              # R11: +1 (was 7) — grid weather feature space richer
    l2_leaf_reg:
      type: float
      low: 1.0
      high: 5.0            # R11: expanded from [1.0, 3.0] — grid regularization
    min_child_samples:
      type: int
      low: 30              # R11: expanded from [50, 100]
      high: 120
    subsample:
      type: float
      low: 0.6              # R11: expanded from [0.65, 0.95]
      high: 0.95
    loss_function:
      type: categorical
      choices: ["RMSE","MAE"]
    colsample_bylevel:
      type: float
      low: 0.6              # R11: NEW — CPU-only, feature sampling per split
      high: 1.0
    leaf_estimation_iterations:
      type: int
      low: 1                # R11: NEW — Newton iterations for leaf values
      high: 10

tft:
  n_trials: 15             # R6 Production HPO
  search_space:
    # hidden_size: fixed at 64 in tft.yaml (R5: 128→64, optimal for 13 covariates)
    # windows_batch_size: fixed at 512 in tft.yaml (RunPod L4/A100)
    n_head:
      type: categorical
      choices: [2, 4]     # 1 too weak for hidden=64, 2-4 optimal
    dropout:
      type: float
      low: 0.05
      high: 0.2           # Wider range around default 0.1
    n_rnn_layers:
      type: categorical
      choices: [1, 2]     # Explore deeper RNN (NF: n_rnn_layers)
    learning_rate:
      type: float
      low: 0.0005
      high: 0.005         # Range around default 0.001
      log: true

tsmixerx:
  n_trials: 40             # R11 Grid Weather HPO — 7 params (max_steps FIXED at 5000)
  search_space:
    n_block:
      type: categorical
      choices: [2, 3, 4]
    ff_dim:
      type: categorical
      choices: [64, 128, 256]
    dropout:
      type: float
      low: 0.0                # R11: expanded from [0.05, 0.3] — allow no-dropout
      high: 0.3
    learning_rate:
      type: float
      low: 0.0003             # R11: slightly wider from [0.0005, 0.005]
      high: 0.007
      log: true
    # max_steps: FIXED at 5000 in tsmixerx.yaml (user directive — no HPO)
    windows_batch_size:
      type: categorical
      choices: [128, 256, 512]  # R11: NEW — batch size HPO (L4/A40 VRAM ample)
    weight_decay:
      type: float
      low: 0.000001             # R11: NEW — AdamW L2 regularization
      high: 0.001
      log: true
    loss:
      type: categorical
      choices: ["mae", "mse", "huber"]  # R11: NEW — BC olmadan loss search

cross_validation:
  n_splits: 12             # Production: 12-fold TSCV
  val_months: 1
  test_months: 1
  gap_hours: 0
  shuffle: false
