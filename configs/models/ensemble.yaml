# Ensemble configuration — R11 2-model (TFT disabled)
# 2-model ensemble: CatBoost + TSMixerx
# TFT disabled: training time too long, marginal contribution (R7 weight 0.23)

# Ensemble mode: "weighted_average", "stacking", or "auto" (tries both, picks best)
mode: "auto"

# Active models (can be overridden via CLI --models flag)
active_models:
  - catboost
  - tsmixerx

# Default weights — equal initial, SLSQP will optimize
# TFT explicitly 0.0 (disabled from active_models)
weights:
  catboost: 0.5
  tft: 0.0
  tsmixerx: 0.5

# Weight optimization settings (used when mode=weighted_average)
optimization:
  enabled: true
  metric: "mape"  # Metric to minimize
  bounds:
    catboost: [0.3, 0.7]
    tft: [0.0, 0.0]
    tsmixerx: [0.3, 0.7]

# Stacking meta-learner config (used when mode=stacking)
stacking:
  meta_learner:
    depth: 2                      # Very shallow — only learns conditional weighting
    iterations: 500
    early_stopping_rounds: 30
    learning_rate: 0.05
    loss_function: "RMSE"
    l2_leaf_reg: 3.0
    task_type: "CPU"              # Meta-learner is tiny, CPU sufficient
    verbose: 50
  context_features:               # Context features added to OOF predictions
    - hour
    - day_of_week
    - is_weekend
    - is_holiday
    - month

# Fallback behavior when one model fails
fallback:
  enabled: true  # Continue with remaining models if one fails
