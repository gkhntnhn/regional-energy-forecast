# Ensemble configuration — R6 optimized
# SLSQP weight optimization: TFT=0.52 CB=0.48 Prophet=0.00 (2.79% MAPE)
# Stacking (2.88-2.96%) < weighted_average (2.79%) — simpler is better

# Ensemble mode: "weighted_average" (R6 optimal) or "stacking" (fallback)
mode: "weighted_average"

# Active models (can be overridden via CLI --models flag)
active_models:
  - tft
  - catboost
  - tsmixerx

# Default weights — equal initial, SLSQP will optimize
# Prophet excluded: optimizer assigned 0.000 weight
weights:
  catboost: 0.33
  prophet: 0.0
  tft: 0.34
  tsmixerx: 0.33

# Weight optimization settings (used when mode=weighted_average)
optimization:
  enabled: true
  metric: "mape"  # Metric to minimize
  bounds:
    catboost: [0.2, 0.7]
    tft: [0.2, 0.7]
    tsmixerx: [0.1, 0.5]

# Stacking meta-learner config (used when mode=stacking)
stacking:
  meta_learner:
    depth: 2                      # Very shallow — only learns conditional weighting
    iterations: 500
    early_stopping_rounds: 30
    learning_rate: 0.05
    loss_function: "RMSE"
    l2_leaf_reg: 3.0
    task_type: "CPU"              # Meta-learner is tiny, CPU sufficient
    verbose: 50
  context_features:               # Context features added to OOF predictions
    - hour
    - day_of_week
    - is_weekend
    - is_holiday
    - month

# Fallback behavior when one model fails
fallback:
  enabled: true  # Continue with remaining models if one fails
