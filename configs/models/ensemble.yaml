# Ensemble configuration — R12 single-model (TSMixerx-only)
# CB + TFT config-level off — kod, test, YAML korunuyor (disaster recovery için)
# Pattern referans: R11'de TFT iptal edilirken aynı yaklaşım — sadece active_models'tan çıkarıldı

# Ensemble mode: "weighted_average" (tek model için stacking anlamsız)
mode: "weighted_average"

# Active models (can be overridden via CLI --models flag)
active_models:
  - tsmixerx
# catboost ve tft KASITLI ÇIKARILDI — aktif modeller listesinde değiller
# Ama src/, tests/, configs/ altındaki kodları korunuyor (R12 reject olursa 10 sn'de geri aktive)

# Default weights — tek model fixed 1.0
weights:
  catboost: 0.0
  tft: 0.0
  tsmixerx: 1.0

# Weight optimization settings (tek model olunca devre dışı)
optimization:
  enabled: false
  metric: "mape"
  bounds:
    catboost: [0.0, 0.0]
    tft: [0.0, 0.0]
    tsmixerx: [1.0, 1.0]

# Stacking meta-learner config (DOKUNULMAZ — disaster recovery için kalır, invoke edilmez)
stacking:
  meta_learner:
    depth: 2                      # Very shallow — only learns conditional weighting
    iterations: 500
    early_stopping_rounds: 30
    learning_rate: 0.05
    loss_function: "RMSE"
    l2_leaf_reg: 3.0
    task_type: "CPU"              # Meta-learner is tiny, CPU sufficient
    verbose: 50
  context_features:               # Context features added to OOF predictions
    - hour
    - day_of_week
    - is_weekend
    - is_holiday
    - month

# Fallback behavior when one model fails
fallback:
  enabled: true  # Continue with remaining models if one fails
