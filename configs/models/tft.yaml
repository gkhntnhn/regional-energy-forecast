# Temporal Fusion Transformer configuration (NeuralForecast)
# R5: 13-covariate pruned config (~600K params, rolling eval, winter-fix)
# Baseline: Val 3.23%, Test 3.05% (1000 step, 12 split, 1 trial, local GPU)
architecture:
  hidden_size: 64
  n_head: 4
  n_rnn_layers: 2
  dropout: 0.1

training:
  encoder_length: 168         # 7 days input window
  prediction_length: 48       # h (forecast horizon)
  max_steps: 3000             # Production (local test: 1000)
  windows_batch_size: 64      # RTX 4000 Ada — smaller batch faster steps
  step_size: 12               # Window stride: 4.8x speedup (benchmark validated)
  learning_rate: 0.001
  early_stop_patience_steps: 200
  val_check_steps: 50
  gradient_clip_val: 0.1
  random_seed: 42
  accelerator: "gpu"          # Production RunPod
  num_workers: 4              # Production RunPod (local: 0)
  enable_progress_bar: true
  precision: "bf16-mixed"     # Production A100/L4 (local: 32-true)
  scaler_type: "robust"
  rnn_type: "lstm"

optimization:
  optuna_splits: 12           # Full 12-fold for R6 production HPO
  n_jobs: 1
  val_size_hours: 720         # ~1 month for final model validation

# R5: 13 covariates (6 futr + 7 hist)
# Pruned from 38 → 13 via CatBoost importance + winter-fix analysis
# ~600K params (was 6.1M with 38 covariates)
covariates:
  # Known at prediction time — enters encoder AND decoder
  time_varying_known:
    - apparent_temperature        # 2.24% — primary weather signal
    - holiday_duration            # 2.22% — consecutive holiday length
    - tatil_tipi                  # 1.44% — holiday type (0/1/2)
    - day_of_week_sin             # 0.94% — weekly cycle
    - wth_hdd                     # heating degree days — winter demand signal
    - is_weekend                  # 0.30% — weekday/weekend split

  # Observed only in past (lagged >= 48h) — enters ONLY encoder
  time_varying_unknown:
    - consumption_lag_168         # 27.04% — weekly lag (dominant)
    - consumption_lag_336         # 9.24% — 2-week lag
    - consumption_week_ratio      # 8.02% — week-over-week ratio
    - consumption_lag_48          # 6.09% — 2-day lag
    - consumption_momentum_168    # 2.46% — weekly momentum
    - temperature_2m_window_24_max  # 2.24% — daily peak temperature
    - consumption_pct_change_168  # 1.96% — weekly change (seasonal transition)

quantiles:
  - 0.02
  - 0.10
  - 0.25
  - 0.50
  - 0.75
  - 0.90
  - 0.98

loss: "quantile"

# R6 HPO best params (Trial #1, Val 2.19%, Test 2.30%)
best_params:
  n_head: 4
  dropout: 0.14016725176148134
  n_rnn_layers: 1
  learning_rate: 0.004665303012212832
