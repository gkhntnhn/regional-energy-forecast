# R10 Box-Cox smoke test — 12-split, 3K/1K/5K steps
# Usage: --config configs/smoke_override_boxcox.yaml --force-hpo --no-mlflow
catboost:
  n_trials: 1
  training:
    iterations: 3000
    early_stopping_rounds: 100
  search_space:
    learning_rate:
      type: float
      low: 0.03
      high: 0.03
    depth:
      type: int
      low: 6
      high: 6
    loss_function:
      type: categorical
      choices: ["RMSE"]
tft:
  n_trials: 1
  loss: "mae"
  search_space:
    n_head:
      type: categorical
      choices: [2]
    n_rnn_layers:
      type: categorical
      choices: [1]
    loss:
      type: categorical
      choices: ["mae"]
  training:
    max_steps: 1000
    windows_batch_size: 128
    encoder_length: 48
tsmixerx:
  n_trials: 1
  loss: "mae"
  search_space:
    n_block:
      type: categorical
      choices: [2]
    ff_dim:
      type: categorical
      choices: [64]
    max_steps:
      type: categorical
      choices: [5000]
    loss:
      type: categorical
      choices: ["mae"]
  training:
    max_steps: 5000
cross_validation:
  n_splits: 12
validation:
  skip_after_optuna: true
