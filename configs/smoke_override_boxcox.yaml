# R10 Box-Cox smoke test — verify BC pipeline end-to-end (~5 min)
# Usage: --config configs/smoke_override_boxcox.yaml --force-hpo --no-mlflow
catboost:
  n_trials: 1
  training:
    iterations: 10
    early_stopping_rounds: 5
  search_space:
    learning_rate:
      type: float
      low: 0.03
      high: 0.03
    depth:
      type: int
      low: 4
      high: 4
    loss_function:
      type: categorical
      choices: ["RMSE"]
tft:
  n_trials: 1
  loss: "mae"
  search_space:
    n_head:
      type: categorical
      choices: [2]
    n_rnn_layers:
      type: categorical
      choices: [1]
    loss:
      type: categorical
      choices: ["mae"]
  training:
    max_steps: 10
    windows_batch_size: 128
    encoder_length: 48
tsmixerx:
  n_trials: 1
  loss: "mae"
  search_space:
    n_block:
      type: categorical
      choices: [2]
    ff_dim:
      type: categorical
      choices: [64]
    max_steps:
      type: categorical
      choices: [10]
    loss:
      type: categorical
      choices: ["mae"]
  training:
    max_steps: 10
cross_validation:
  n_splits: 3
validation:
  skip_after_optuna: true
