# EPIAS feature configuration
# CRITICAL: min_lag=48, raw values are DROPPED after feature creation
source:
  cache_dir: "data/external/epias"
  file_pattern: "epias_market_{year}.parquet"

variables:
  - FDPP                          # KGÜP toplam — planlanan üretim (region=TR1 gerektirir)
  - Real_Time_Consumption
  - DAM_Purchase
  - Load_Forecast
  - Bilateral_Agreement_Purchase  # Re-enabled for broader ensemble feature set

lags:
  min_lag: 48
  values:
    - 48
    - 72            # Re-enabled for broader ensemble feature set
    - 168

rolling:
  # shift(1) THEN rolling()
  windows:
    - 24
    - 48            # Re-enabled for broader ensemble feature set
    - 168
  functions:
    - mean
    - std           # Re-enabled for broader ensemble feature set

expanding:
  min_periods: 48
  functions:
    - mean
    - std

drop_raw: true

# Real-time generation data (supply-side features)
# CRITICAL: min_lag=48, raw gen_ values are DROPPED after feature creation
generation:
  # R2 prune: 5→2 variables (individual fuels near-zero, aggregate + dominant thermal yeter)
  # Composite ratios: renewable_ratio = 1 - (natural_gas / total)
  variables:
    - gen_total
    - gen_natural_gas
    - gen_wind
    - gen_sun
    - gen_dammed_hydro
    - gen_asphaltite_coal
    - gen_biomass
    - gen_black_coal
    - gen_fueloil
    - gen_geothermal
    - gen_import_coal
    - gen_import_export
    - gen_lignite
    # gen_lng: PRUNED — constant (nunique=1, std=0) across 2020-2025
    # gen_naphta: PRUNED — constant (nunique=1, std=0) across 2020-2025
    - gen_river
    - gen_wasteheat
  lags:
    min_lag: 48
    values:
      - 48
      - 72
      - 168
  rolling:
    windows:
      - 24
      - 48
      - 168
    functions:
      - mean
      - std
  expanding:
    min_periods: 48
    functions:
      - mean
      - std
  drop_raw: true
  composites:
    # Supply-side mix ratios from lagged generation data
    # R2: renewable_ratio = 1 - thermal_ratio (gen_total ve gen_natural_gas'tan turetilir)
    enabled: true
    renewable_vars: []    # R2: bos — renewable_ratio = 1 - thermal_ratio olarak hesaplanir
    thermal_vars:
      - gen_natural_gas
    total_var: gen_total
    lag: 48
