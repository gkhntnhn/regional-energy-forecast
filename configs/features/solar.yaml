# Solar feature configuration
# NOTE: Solar features are NOT leakage — deterministic astronomical calculation
location:
  latitude: 40.183   # Bursa (primary)
  longitude: 29.050
  altitude: 100
  timezone: "Europe/Istanbul"

panel:
  tilt: 35
  azimuth: 180  # south-facing

features:
  - sol_elevation
  - sol_azimuth
  - sol_ghi
  - sol_dni
  - sol_dhi
  - sol_poa_global
  - sol_clearness_index
  - sol_daylight_hours
  - sol_cloud_proxy
  - sol_is_daylight

# Re-enabled for broader ensemble feature set
disabled_features: []

lead:
  # Solar lead/lag features (NOT leakage — deterministic astronomical calculation)
  enabled: true
  hours: [1, 3, 6, 12, 24]  # 48 removed: shift(-48) produces all-NaN in forecast rows
  lag_range:
    min: -10
    max: 10
  lag_columns:
    - sol_ghi
    - sol_dni
    - sol_dhi
